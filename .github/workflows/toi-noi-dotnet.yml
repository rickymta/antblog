name: Toi Noi .NET service lab
on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/toi-noi-dotnet/31-38-trip-service/**'
      - '.github/workflows/toi-noi-dotnet.yml'
  pull_request:
    paths:
      - 'examples/toi-noi-dotnet/31-38-trip-service/**'
      - '.github/workflows/toi-noi-dotnet.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: toi_noi_dotnet_lab
          POSTGRES_USER: lab_user
          POSTGRES_PASSWORD: ci-lab-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_user -d toi_noi_dotnet_lab"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TOI_NOI_PG: Host=127.0.0.1;Port=5432;Database=toi_noi_dotnet_lab;Username=lab_user;Password=ci-lab-only
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Test real PostgreSQL and HTTP pipeline
        run: dotnet test examples/toi-noi-dotnet/31-38-trip-service/Tests -c Release --logger trx --results-directory artifacts/tests
      - name: Publish OCI archive without pushing a registry
        run: >-
          dotnet publish examples/toi-noi-dotnet/31-38-trip-service/Api -c Release
          --os linux --arch x64 /t:PublishContainer
          -p:ContainerRepository=toi-noi-trips -p:ContainerImageTag=learning
          -p:ContainerBaseImage=mcr.microsoft.com/dotnet/aspnet:10.0
          -p:ContainerUser=1654 -p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/trips.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: trips-lab-artifacts
          path: artifacts/
          if-no-files-found: warn

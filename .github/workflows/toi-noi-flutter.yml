name: Toi Noi Flutter labs
on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/toi-noi-flutter/**'
      - '.github/workflows/toi-noi-flutter.yml'
  pull_request:
    paths:
      - 'examples/toi-noi-flutter/**'
      - '.github/workflows/toi-noi-flutter.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Analyze and test labs 01–06
        run: node examples/toi-noi-flutter/verify-01-06.mjs
      - name: Analyze and test labs 07–16
        run: node examples/toi-noi-flutter/verify-07-16.mjs

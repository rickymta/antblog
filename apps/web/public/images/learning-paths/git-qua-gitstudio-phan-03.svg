<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
    <title>Git qua GitStudio · Phần 3 · Remote và làm việc nhóm</title><desc>Đủ 10 bài GIT-021–GIT-030 qua tuần làm việc chung đầu tiên của Minh và Lan ở Tới Nơi: remote, origin và nhánh remote-tracking, fetch/pull/push, ahead/behind và push bị từ chối với --force-with-lease, xác thực HTTPS token và SSH key, GitHub/GitLab trong GitStudio, pull request có review và squash merge, chiến lược nhánh với main được bảo vệ bằng hook, fork và upstream, pull rẽ đôi và pull.rebase; kết thúc bằng bài thực hành có script chấm 10 tiêu chí. Lab chạy với remote cục bộ, không cần tài khoản. Gồm 3 bài cơ bản, 4 trung bình và 3 nâng cao.</desc>

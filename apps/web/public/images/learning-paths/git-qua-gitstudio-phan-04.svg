<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
    <title>Git qua GitStudio · Phần 4 · Viết lại lịch sử và hoàn tác</title><desc>Đủ 10 bài GIT-031–GIT-040 qua hai ngày Minh làm tính năng phụ phí đêm: bỏ thay đổi bằng restore và clean, reset soft/mixed/hard, revert commit đã push và merge commit, cứu commit bằng reflog, nút Hoàn tác của GitStudio và lệnh git bên dưới, sửa/bỏ/đổi thứ tự commit cũ, rebase tương tác với --fixup và --autosquash, rebase --onto cho nhánh tạo sai gốc, patch qua git am và rerere; kết thúc bằng runbook hoàn tác và script chấm 10 tiêu chí. Gồm 3 bài cơ bản, 4 trung bình và 3 nâng cao.</desc>

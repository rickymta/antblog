<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
    <title>Git qua GitStudio · Phần 6 · Quy trình nhóm và tự động hoá</title><desc>Đủ 10 bài GIT-051–GIT-060, phần cuối của series: Conventional Commits và CHANGELOG sinh từ lịch sử, phát hành theo semver với tag có chữ ký và nhánh phát hành, Workspace và Launchpad của GitStudio cho nhiều repository, Git trong CI (fetch-depth, phiên bản từ tag, quyền token), xử lý khoá API lỡ commit, monorepo hay nhiều repository với CODEOWNERS và ADR, gộp và tách repository bằng subtree, cấu hình git chung của nhóm, sổ tay sự cố; kết thúc bằng phát hành 1.4.0 theo runbook và script chấm 10 tiêu chí. Gồm 3 bài cơ bản, 4 trung bình và 3 nâng cao.</desc>

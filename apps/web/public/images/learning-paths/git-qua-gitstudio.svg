    <title>Git qua GitStudio · Phần 1 · Repository, commit và lịch sử</title><desc>Đủ 10 bài GIT-001–GIT-010 qua Tới Nơi: version control và GitStudio, cài đặt và danh tính commit, init và clone, ba vùng và .gitignore, stage theo hunk và amend, đọc lịch sử, diff và xuống dòng CRLF/LF, bên trong .git, blame và pickaxe; kết thúc bằng bài thực hành dựng repository dịch vụ báo giá có script chấm. Mỗi thao tác làm trên giao diện GitStudio, Spotlight và terminal tích hợp. Gồm 3 bài cơ bản, 4 trung bình và 3 nâng cao.</desc>

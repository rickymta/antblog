<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
    <title>PostgreSQL · Phần 6 · Mở rộng, tích hợp và vận hành đầu cuối</title><desc>Mười bài khép lại series PostgreSQL qua Tới Nơi: partition và vòng đời dữ liệu, JSONB, primary/standby, logical replication, materialized view, PostGIS/pgvector, failover có fencing, nâng phiên bản 17 → 18 và capstone đối soát sau sự cố. Lab PostgreSQL 18 thật dựng nhiều cluster, giả lập mất primary, split-brain và pg_rewind.</desc>

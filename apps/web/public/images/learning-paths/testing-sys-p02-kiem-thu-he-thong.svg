    <title>Kiểm thử hệ thống Tới Nơi · Phần 2/2</title><desc>Phần nâng cao của kiểm thử hệ thống Tới Nơi: stress và hồi phục sau quá tải, security test và pentest trong phạm vi được chỉ định, compatibility theo ma trận trình duyệt, usability với kịch bản và worksheet quan sát, data integrity cho tiền và trạng thái chuyến, recovery với restore drill PostgreSQL, và UAT với acceptance kit — tách rõ phần tự động với phần cần con người và môi trường thật.</desc>

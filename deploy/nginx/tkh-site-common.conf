# Phần chung của server trang đọc và server trang quản trị (include ở mức server).

client_max_body_size 8m;   # API: JSON tối đa 2 MB, ảnh tải lên tối đa 5 MB

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

location /api/ {
  limit_req zone=tkh_api burst=60 nodelay;
  proxy_pass http://tkh_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  # $remote_addr đã là IP thật của người dùng (real_ip từ CF-Connecting-IP). GHI ĐÈ, không nối thêm,
  # để không ai giả được X-Forwarded-For; API tin mạng nội bộ compose (TRUST_PROXY) nên req.ip = IP thật.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 60s;
}

# Ảnh trong thư viện media: đọc thẳng volume `uploads` (API ghi, nginx chỉ đọc). Tên tệp ngẫu nhiên ⇒ cache lâu.
location /uploads/ {
  alias /var/www/uploads/;
  autoindex off;
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, immutable" always;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
  include /etc/nginx/snippets/tkh-headers.conf;
}

location = /healthz {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

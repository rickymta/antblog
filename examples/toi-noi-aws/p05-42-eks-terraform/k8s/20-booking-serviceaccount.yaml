# Tên ServiceAccount phải khớp với service_account trong aws_eks_pod_identity_association (main.tf).
# Không có annotation role-arn: Pod Identity nối role qua association, không qua annotation như IRSA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking
  namespace: booking
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: toinoi

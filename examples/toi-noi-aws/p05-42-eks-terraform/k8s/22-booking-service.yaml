# ClusterIP: chỉ truy cập được trong cluster. Đưa ra ngoài bằng Ingress ở bài 43.
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: booking
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: toinoi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: booking
  ports:
    - name: http
      port: 80
      targetPort: http

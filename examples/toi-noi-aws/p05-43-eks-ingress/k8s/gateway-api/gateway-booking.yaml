# THAM KHẢO, chưa kiểm chứng: Gateway API thay cho Ingress. Không áp cùng lúc với k8s/10-ingress-booking.yaml cho cùng host.
# Cần: Load Balancer Controller từ v2.14.0 (HTTPRoute với ALB), CRD Gateway API và CRD riêng của controller; controller tự bật khi thấy CRD.
# Chứng chỉ ACM và thuộc tính ALB (scheme, listener HTTPS) khai qua CRD LoadBalancerConfiguration (gateway.k8s.aws/v1,
# trường listenerConfigurations[].defaultCertificate), gắn vào Gateway bằng spec.infrastructure.parametersRef; xem tài liệu trước khi dùng.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: toinoi-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: toinoi-public
  namespace: booking
spec:
  gatewayClassName: toinoi-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booking
  namespace: booking
spec:
  parentRefs:
    - name: toinoi-public
  hostnames:
    - api.toinoi.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/bookings
      backendRefs:
        - name: booking
          port: 80

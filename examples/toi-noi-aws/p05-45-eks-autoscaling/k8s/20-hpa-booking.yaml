# HPA v2 cho booking theo CPU. Cần metrics-server (README). CPU 60% là phần trăm của request (250m), không phải của node.
# Scale lên nhanh, xuống chậm: tránh dao động khi tải 11:00 và 17:00 lên xuống theo từng đợt.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking
  namespace: booking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

# VPA chỉ gợi ý (updateMode Off), không tự sửa request. Đọc gợi ý bằng: kubectl -n booking describe vpa booking
# Cần cài VPA riêng (không phải add-on của EKS). Không cho VPA tự cập nhật CPU khi HPA đang scale theo CPU của cùng Deployment.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: booking
  namespace: booking
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: booking
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "1"
          memory: 1Gi

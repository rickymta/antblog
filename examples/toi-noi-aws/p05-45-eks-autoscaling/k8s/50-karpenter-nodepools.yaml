# Karpenter v1 API (karpenter.sh/v1 và karpenter.k8s.aws/v1). Cần Karpenter đã cài (README) và tag karpenter.sh/discovery (Terraform).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Tên role từ output karpenter_node_role_name của Terraform.
  role: toinoi-lab-karpenter-node
  # v1 bắt buộc có amiSelectorTerms. @latest tiện cho lab; ở production hãy ghim phiên bản AMI.
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: toinoi-lab-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: toinoi-lab-eks
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
  tags:
    Project: ToiNoi
    Env: lab
    Owner: platform
    Service: platform
---
# Worker chịu được gián đoạn: chỉ Spot, Graviton, nhiều họ instance để có nhiều vùng giá. Taint buộc pod phải khai tolerations.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot-workers
spec:
  weight: 50
  template:
    metadata:
      labels:
        toinoi.example/capacity: spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "metal"]
      taints:
        - key: toinoi.example/capacity
          value: spot
          effect: NoSchedule
      # Thay node định kỳ để nhận AMI và vá lỗi mới; node sống tối đa 30 ngày.
      expireAfter: 720h
      # Sau 48 giờ bị drain, Karpenter xoá node dù PDB còn chặn.
      terminationGracePeriod: 48h
  limits:
    cpu: "200"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      # Mặc định: không quá 10% node bị gián đoạn cùng lúc.
      - nodes: "10%"
      # Không gom node trong giờ cao điểm (cron theo UTC: 04:00-06:00 và 10:00-12:00 UTC = 11:00-13:00 và 17:00-19:00 giờ Việt Nam).
      - nodes: "0"
        schedule: "0 4 * * *"
        duration: 2h
        reasons:
          - Underutilized
          - Empty
      - nodes: "0"
        schedule: "0 10 * * *"
        duration: 2h
        reasons:
          - Underutilized
          - Empty
---
# Dự phòng on-demand cho pod không chịu được gián đoạn. weight thấp hơn nên chỉ dùng khi pod không lên được NodePool Spot.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand-fallback
spec:
  weight: 10
  template:
    metadata:
      labels:
        toinoi.example/capacity: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      expireAfter: 720h
  limits:
    cpu: "40"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m

# Đăng ký cluster prod vào Argo CD bằng IAM, không dùng token ServiceAccount dài hạn.
# Tên hiển thị trong Argo CD là toinoi-prod; awsAuthConfig.clusterName là tên cluster EKS toinoi-prod-eks.
# Role argocd-deployer phải được map vào cluster toinoi-prod-eks bằng EKS access entry
# (quyền Kubernetes do access policy hoặc nhóm RBAC bạn gán).
# Chưa được kiểm chứng trên tài khoản thật: cần chạy thử trước khi dựa vào.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-toinoi-prod
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: prod
type: Opaque
stringData:
  name: toinoi-prod
  server: https://EXAMPLE0000000000000000000000000.gr7.ap-southeast-1.eks.amazonaws.com
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "toinoi-prod-eks",
        "roleARN": "arn:aws:iam::123456789012:role/toinoi-prod-argocd-deployer"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": "BASE64_CA_CLUSTER_PROD"
      }
    }

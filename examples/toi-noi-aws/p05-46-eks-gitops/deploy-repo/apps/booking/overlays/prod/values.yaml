env: prod
image:
  # Promote = chép dòng digest này sang overlay kế tiếp bằng pull request (xem bài 25).
  digest: sha256:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 768Mi
pdb:
  enabled: true
  minAvailable: 2
ingress:
  enabled: true
  host: api.toinoi.example
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
migration:
  enabled: true
  image: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/toinoi/booking-migrate@sha256:d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4

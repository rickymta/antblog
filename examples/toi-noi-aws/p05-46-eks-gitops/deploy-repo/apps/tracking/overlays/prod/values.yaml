env: prod
image:
  # Promote = chép dòng digest này sang overlay kế tiếp bằng pull request (xem bài 25).
  digest: sha256:c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 768Mi
pdb:
  enabled: true
  minAvailable: 2
ingress:
  enabled: true
  host: tracking.toinoi.example
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

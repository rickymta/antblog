apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      Env: dev
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      kind: CronJob
      name: tracking-cleanup
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/args/0
        value: --older-than-days=1

# Không khai báo auth: ESO dùng chuỗi credential mặc định của AWS SDK, tức là role Pod Identity
# gắn với ServiceAccount của controller. Không có access key trong cluster.
# conditions giới hạn namespace nào được tham chiếu store này.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: toinoi-secrets-manager
spec:
  conditions:
    - namespaces: [booking, dispatch, tracking]
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: toinoi-parameter-store
spec:
  conditions:
    - namespaces: [booking, dispatch, tracking]
  provider:
    aws:
      service: ParameterStore
      region: ap-southeast-1

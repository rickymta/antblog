# Đồng bộ secret toinoi/lab/booking/db trong Secrets Manager thành Secret booking-db.
# refreshInterval 1h: đổi giá trị trên AWS thì cluster nhận sau tối đa 1 giờ; pod đọc qua biến môi trường
# vẫn cần restart để thấy giá trị mới (hoặc mount dạng file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: booking-db
  namespace: booking
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: toinoi-secrets-manager
  target:
    name: booking-db
    creationPolicy: Owner
  data:
    - secretKey: connection-string
      remoteRef:
        key: toinoi/lab/booking/db
        property: connection_string

# ExternalSecret trong namespace X chỉ được tham chiếu secret có key bắt đầu bằng toinoi/lab/X/.
# Chặn việc một namespace nhờ ESO đọc secret của namespace khác.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: toinoi-externalsecret-key-prefix
spec:
  background: false
  rules:
    - name: key-prefix-matches-namespace
      match:
        any:
          - resources:
              kinds: [external-secrets.io/v1/ExternalSecret]
      validate:
        failureAction: Enforce
        message: "remoteRef.key phải bắt đầu bằng toinoi/lab/<namespace>/."
        foreach:
          - list: "request.object.spec.data || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: "toinoi/lab/{{ request.namespace }}/*"

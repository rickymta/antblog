# AWS Gateway API Controller cho VPC Lattice (repo aws/aws-application-networking-k8s).
# Gateway ứng với một service network, mỗi HTTPRoute thành một Lattice service. Tên Gateway trùng tên service network.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: amazon-vpc-lattice
spec:
  controllerName: application-networking.k8s.aws/gateway-api-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: toinoi-lab
  namespace: booking
spec:
  gatewayClassName: amazon-vpc-lattice
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
# booking được publish vào service network để ECS (pricing) và Lambda (fraud) gọi lại nếu cần.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booking
  namespace: booking
spec:
  parentRefs:
    - name: toinoi-lab
      sectionName: http
  rules:
    - backendRefs:
        - name: booking-stable
          kind: Service
          port: 80
---
# Chỉ role của pricing mới được gọi booking qua Lattice; yêu cầu phải ký SigV4 (service vpc-lattice-svcs).
apiVersion: application-networking.k8s.aws/v1alpha1
kind: IAMAuthPolicy
metadata:
  name: booking-allow-pricing
  namespace: booking
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: booking
  policy: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam::123456789012:role/toinoi-lab-pricing-task" },
          "Action": "vpc-lattice-svcs:Invoke",
          "Resource": "*"
        }
      ]
    }

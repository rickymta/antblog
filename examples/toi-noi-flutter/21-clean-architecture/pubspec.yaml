dev_dependencies:
  dio: ^5.11.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shelf: ^1.4.3
  toi_noi_fake_api:
    path: ../tools/fake_api

flutter:
  uses-material-design: true

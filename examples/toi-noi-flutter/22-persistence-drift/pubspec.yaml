name: toi_noi_22
description: "Lab bài 22 (Flutter qua Tới Nơi): lưu cục bộ bằng drift, shared_preferences và flutter_secure_storage."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  toi_noi_core:
    path: ../packages/toi_noi_core
  toi_noi_ui:
    path: ../packages/toi_noi_ui

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.1.1
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

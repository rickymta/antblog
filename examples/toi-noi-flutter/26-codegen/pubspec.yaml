name: toi_noi_26
description: "Lab bài 26 (Flutter qua Tới Nơi): sinh mã bằng freezed, json_serializable và riverpod_generator; so sánh DTO sinh mã với DTO viết tay của toi_noi_api."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.8
  toi_noi_api:
    path: ../packages/toi_noi_api
  toi_noi_core:
    path: ../packages/toi_noi_core

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  shelf: ^1.4.3
  toi_noi_fake_api:
    path: ../tools/fake_api

flutter:
  uses-material-design: true

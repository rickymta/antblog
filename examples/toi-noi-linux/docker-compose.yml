# Lab "Linux qua SSH Studio và Tới Nơi": một server Ubuntu 24.04 có sshd.
#   docker compose up -d --build --wait
#   SSH: 127.0.0.1 cổng 2222, người dùng an, mật khẩu toinoi-lab (chỉ dùng cho lab)
name: toinoi-linux-lab

services:
  app01:
    build:
      context: ./docker
    image: toinoi-linux-lab:p01
    container_name: toinoi-app-01
    hostname: toinoi-app-01
    # systemd làm PID 1 cần quyền quản lý cgroup của chính container.
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      # Chỉ mở cho máy của bạn; không ai trong mạng LAN kết nối được.
      - "127.0.0.1:2222:22"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet ssh"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

# Kịch bản baseline trên đồ thị TP.HCM (data/hcm-graph.bin, bbox lat 10,70–10,86, lng 106,60–106,78).
# Mọi tham số là GIẢ ĐỊNH của lab để có thước đo lặp lại được, không đo từ dữ liệu thật và không đại diện cho công ty nào.
# Toạ độ các điểm nóng là toạ độ gần đúng của địa danh, chỉ dùng làm tâm nhu cầu mô phỏng.
name = "hcm-baseline"
graph = "hcm"
seed = 20261106
start_hour = 8
duration_s = 3600
drivers = 120
traffic = "free_flow"
traffic_center = [10.7725, 106.6980]
traffic_radius_m = 5000
decision = "immediate"

[demand]

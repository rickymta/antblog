# Workspace lab «Service định vị qua Tới Nơi». Phiên bản thư viện ghim ở đây và trong Cargo.lock (commit).
[workspace]
resolver = "3"
members = ["crates/geo-core", "crates/road-graph", "crates/driver-store", "labs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
# nội bộ
geo-core = { path = "crates/geo-core" }
road-graph = { path = "crates/road-graph" }
driver-store = { path = "crates/driver-store" }
# hình học và chỉ mục
h3o = "0.11.1"
rstar = "0.14.0"
geo = "0.33.1"
geo-types = "0.7.20"
geojson = "1.0.0"
polyline = "0.11.0"
# dữ liệu bản đồ
osmpbf = "0.3.8"
rayon = "1.12.0"
# tuần tự hóa
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", features = ["use-std"] }
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
# tiện ích
rustc-hash = "2.1.3"
fastrand = "2.5.0"
thiserror = "2.0.21"
# Redis: bản ổn định 1.x (bản 2.0.0-rc.2 mới nhất là prerelease nên không dùng)
redis = { version = "1.8.1", default-features = false }
# đo và kiểm thử
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
debug = 1          # giữ symbol cho flamegraph ở các bài sau, không đổi tốc độ
lto = "thin"
codegen-units = 4

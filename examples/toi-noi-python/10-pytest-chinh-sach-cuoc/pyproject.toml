[project]
name = "toi-noi-py-10-pytest-chinh-sach-cuoc"
version = "0.1.0"
description = "Bài 10: kiểm thử chính sách cước Tới Nơi bằng pytest"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Cấu hình của test runner, không phải của ứng dụng: pytest thêm "." (thư mục lab) vào
# sys.path khi thu thập test, để `import fare` thấy fare.py đặt phẳng cạnh pyproject.toml.
pythonpath = ["."]
# Chỉ dùng khi chạy `pytest` không đối số trong thư mục lab.
testpaths = ["tests"]

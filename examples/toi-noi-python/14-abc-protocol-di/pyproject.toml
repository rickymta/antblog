[project]
name = "toi-noi-py-14-abc-protocol-di"
version = "0.1.0"
description = "Bài 14: ABC, Protocol, composition và dependency injection cho báo giá Tới Nơi"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "mypy>=2.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# pytest thêm "." (thư mục lab) vào sys.path để `import fare`, `import service`... chạy được.
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"

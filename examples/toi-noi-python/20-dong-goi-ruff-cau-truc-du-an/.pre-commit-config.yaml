# Cấu hình pre-commit cho một repo chỉ chứa project này (file nằm ở gốc repo).
# Chỉ là cấu hình mẫu: lab KHÔNG cài hook vào .git; xem README để thử trong một repo tạm.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # khớp phiên bản ruff trong uv.lock
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false # mypy cần nhìn cả gói, không chỉ file vừa sửa
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml

# Cấu hình Alembic của lab 24. Chạy từ gốc repository:
#   uv run --project examples/toi-noi-python/24-sqlalchemy-postgresql-alembic \
#       alembic -c examples/toi-noi-python/24-sqlalchemy-postgresql-alembic/alembic.ini upgrade head
[alembic]
# %(here)s là thư mục chứa file ini này, nên lệnh chạy được từ bất kỳ thư mục làm việc nào.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# URL KHÔNG đặt ở đây: migrations/env.py lấy từ settings.py (biến TOINOI_PG_URL).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

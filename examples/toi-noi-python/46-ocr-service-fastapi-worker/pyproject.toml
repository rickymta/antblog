[project]
name = "toi-noi-py-46-ocr-service-fastapi-worker"
version = "0.1.0"
description = "Bài 46: đóng gói OCR thành service: FastAPI nhận ảnh, worker arq chạy Tesseract, timeout, idempotency, tải thử"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-multipart>=0.0.33",
    "pydantic-settings>=2.16",
    "arq>=0.28",
    "redis>=5",
    "pillow>=13",
    "numpy>=2.5",
    "httpx>=0.28",
]

[tool.uv]
package = false

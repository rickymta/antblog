[project]
name = "toi-noi-py-49-face-embedding-cosine-threshold"
version = "0.1.0"
description = "Bài 49: embedding khuôn mặt, cosine similarity, ngưỡng, FAR/FRR và ROC"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "onnxruntime>=1.31",
    "opencv-python-headless>=4.14",
    "scikit-learn>=1.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

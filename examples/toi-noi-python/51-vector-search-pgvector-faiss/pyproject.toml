[project]
name = "toi-noi-py-51-vector-search-pgvector-faiss"
version = "0.1.0"
description = "Bài 51: vector search với pgvector và FAISS, tìm một người nhiều tài khoản"
requires-python = ">=3.14"
dependencies = [

[project]
name = "toi-noi-py-52-face-match-grpc-service"
version = "0.1.0"
description = "Bài 52: service so khớp khuôn mặt (SFace) qua gRPC: nạp mô hình một lần, warm-up, micro-batching, deadline, health, ONNX Runtime"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1",
    "protobuf>=7.35.1",
    "onnxruntime>=1.31.1",
    "numpy>=2.5",
    "pillow>=13",
    "scikit-learn>=1.9.1",
    "onnx>=1.23",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
# grpcio-tools chỉ cần khi sinh lại file *_pb2*.py; --verify dùng nó để kiểm file đã commit còn khớp .proto.
dev = ["grpcio-tools>=1.85.1"]

[tool.uv]
package = false

[tool.ruff]
# File do grpc_tools.protoc sinh: không để ruff sửa (--verify so từng byte với bản sinh lại từ .proto).
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

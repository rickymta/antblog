[project]
name = "toi-noi-py-57-sklearn-lightgbm-imbalanced"
version = "0.1.0"
description = "Bài 57: scikit-learn Pipeline và LightGBM trên dữ liệu gian lận mất cân bằng - split theo thời gian, class weight, ngưỡng, calibration"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.4",
    "lightgbm>=4.6",
    "numpy>=2.5",
    "polars>=2.1",
    "scikit-learn>=1.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# pytest thêm thư mục lab vào sys.path để `import model_io` thấy file đặt phẳng cạnh pyproject.toml.
pythonpath = ["."]
testpaths = ["tests"]

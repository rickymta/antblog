# Hạ tầng dùng chung cho các lab Python từ phần 03 (PostgreSQL + pgvector, MongoDB, Redis, Kafka KRaft).
# Chạy:  docker compose -f examples/toi-noi-python/infra/compose.yml up -d
# Dừng:  docker compose -f examples/toi-noi-python/infra/compose.yml down -v
# Cổng cố ý khác mặc định để không đụng dịch vụ đang chạy trên máy. Mật khẩu chỉ dùng cho lab cục bộ.
name: toinoi-python-lab
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: toinoi
      POSTGRES_PASSWORD: toinoi
      POSTGRES_DB: toinoi
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toinoi -d toinoi"]
      interval: 3s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:8
    ports: ["27019:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["63790:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

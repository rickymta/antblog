# Workspace gốc: chỉ khai báo, không có code. Mỗi thành viên là một package.
[workspace]
members = ["ledger-core", "ledger-cli"]
# `cargo run/test/doc` không kèm -p sẽ chạy trên các package này (từ gốc repo cũng vậy
# khi dùng --manifest-path trỏ vào file này).
default-members = ["ledger-core", "ledger-cli"]
# Workspace ảo không có edition để suy ra resolver nên phải khai báo; bản 3 là mặc định của edition 2024.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Phiên bản dependency khai báo MỘT chỗ; package con viết `thiserror.workspace = true`.
[workspace.dependencies]
rust_decimal = "1.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
ledger-core = { path = "ledger-core" }

# Lint dùng chung. `pedantic` bật cả nhóm ở mức warn; priority = -1 để dòng allow bên dưới thắng.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Gần như mọi getter nhỏ (`dong()`, `as_str()`) sẽ bị gợi ý #[must_use]; ta chỉ gắn tay ở nơi bỏ qua kết quả là bug.
must_use_candidate = "allow"

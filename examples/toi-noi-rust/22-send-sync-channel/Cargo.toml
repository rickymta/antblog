[package]
name = "ledger_22_send_sync_channel"
version = "0.1.0"
edition = "2024"
description = "Lab bài 22: Send, Sync, Arc<Mutex>, RwLock và channel (mpsc, oneshot, broadcast) quanh sổ cái Tới Nơi"

[lib]
name = "ledger_lab"
path = "src/lib.rs"

[[bin]]
name = "ledger-cli"
path = "src/main.rs"

[dependencies]
# Dùng lại thư viện của lab 20, không copy module.
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[package]
name = "ledger_23_sqlx_postgres"
version = "0.1.0"
edition = "2024"
description = "Lab bài 23: sqlx với PostgreSQL, pool, migration và query kiểm tra lúc biên dịch"

[lib]
name = "ledger_lab"
path = "src/lib.rs"

[[bin]]
name = "ledger-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.39"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
rust_decimal = "1.43.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "time", "rust_decimal"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.0", features = ["v4"] }

[package]
name = "ledger-pg"
description = "Adapter sqlx/PostgreSQL cho LedgerRepository và chương trình chạy bộ test hợp đồng (lab bài 26)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
ledger-core.workspace = true
ledger-port.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.0", features = ["v4"] }

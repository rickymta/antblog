[package]
name = "ledger_29_config_tracing"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
config = { version = "0.15.27", default-features = false, features = ["toml"] }
ledger-core = { version = "0.1.0", path = "../20-ledger-core-workspace/ledger-core" }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

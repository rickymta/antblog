[package]
name = "ledger_32_validation_openapi"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
jiff = "0.2.39"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"

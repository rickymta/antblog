[package]
name = "ledger_36_kafka_rdkafka"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 36: rdkafka consumer/producer, commit thủ công, at-least-once, partition key, rebalance, schema JSON có version"

[dependencies]
anyhow = "1.0.104"
jiff = { version = "0.2.39", features = ["serde"] }
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
rdkafka = "0.39.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

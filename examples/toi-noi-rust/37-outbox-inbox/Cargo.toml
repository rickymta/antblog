[package]
name = "ledger_37_outbox_inbox"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 37: outbox, inbox, relay SKIP LOCKED, idempotent consumer và DLQ trên PostgreSQL + Kafka"

[dependencies]
anyhow = "1.0.104"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
rdkafka = "0.39.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

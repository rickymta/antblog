[package]
name = "ledger_38_webhook_hmac"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 38: webhook VíXanh với chữ ký HMAC-SHA256, cửa sổ thời gian, khử trùng bằng external_ref và xử lý đến trước/sau event nội bộ"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.13.0"
ledger-core = { version = "0.1.0", path = "../20-ledger-core-workspace/ledger-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
uuid = { version = "1.29.0", features = ["v4"] }

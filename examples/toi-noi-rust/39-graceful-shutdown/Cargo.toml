[package]
name = "ledger_39_graceful_shutdown"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 39: graceful shutdown, health/readiness và backpressure cho service sổ cái Tới Nơi"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
rdkafka = "0.39.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

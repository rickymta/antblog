[package]
name = "ledger_43_refund_reversal_chargeback"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Lab bài 43: refund, reversal, chargeback và maker-checker trên PostgreSQL"

[lib]
name = "ledger_lab"
path = "src/lib.rs"

[[bin]]
name = "ledger-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[package]
name = "ledger_44_driver_wallet_payout"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 44: thu nhập theo ngày ICT, payout theo lô, ngân hàng giả, đối chiếu sao kê trên PostgreSQL"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.39"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[package]
name = "ledger_45_promo_budget"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Lab bài 45: khuyến mãi, trợ giá và ngân sách campaign là tài khoản có giới hạn"

[lib]
name = "ledger_promo"
path = "src/lib.rs"

[[bin]]
name = "ledger-promo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

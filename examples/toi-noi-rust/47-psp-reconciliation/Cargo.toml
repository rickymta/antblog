[package]
name = "ledger_47_psp_reconciliation"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 47: đối soát sao kê VíXanh (CSV streaming, bảng tạm + COPY, khớp bằng SQL) với sổ cái PostgreSQL"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
futures-util = "0.3.34"
hex = "0.4.3"
jiff = "0.2.39"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

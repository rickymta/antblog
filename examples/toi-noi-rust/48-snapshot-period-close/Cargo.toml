[package]
name = "ledger_48_snapshot_period_close"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 48: số dư theo thời điểm, snapshot hằng ngày, đóng kỳ kế toán và cuộc đua đóng kỳ"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
jiff = "0.2.39"
ledger-core = { version = "0.1.0", path = "../20-ledger-core-workspace/ledger-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
proptest = "1.12.0"

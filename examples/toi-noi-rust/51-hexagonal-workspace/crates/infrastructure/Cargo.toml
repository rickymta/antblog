[package]
name = "infrastructure"
description = "Adapter: bộ nhớ, sqlx/PostgreSQL và Kafka (feature `kafka`) cho các port của application (lab bài 51)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Mặc định bật Kafka; `--no-default-features` bỏ hẳn rdkafka và librdkafka khỏi đồ thị build.
default = ["kafka"]
kafka = ["dep:rdkafka"]

[dependencies]
anyhow = "1.0.104"
application.workspace = true
domain.workspace = true
jiff = "0.2.39"
rdkafka = { version = "0.39.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints]
workspace = true

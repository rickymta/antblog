[package]
name = "ledger_53_aggregate_concurrency"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Lab bài 53: aggregate Account, optimistic locking bằng version, SELECT FOR UPDATE và deadlock trên PostgreSQL"

[dependencies]
anyhow = "1.0.104"
ledger-core = { version = "0.1.0", path = "../20-ledger-core-workspace/ledger-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[package]
name = "ledger_55_event_contract"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab bài 55: hợp đồng sự kiện LedgerEntryPosted bằng protobuf và JSON Schema, đo tương thích tiến/lùi, consumer C#/Go/Python"

[dependencies]
anyhow = "1.0.104"
jsonschema = { version = "0.60.2", default-features = false }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.4"
protoc-bin-vendored = "3.3.0"
serde_json = "1.0.154"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

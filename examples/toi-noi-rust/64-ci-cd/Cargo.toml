[package]
name = "ledger_64_ci_cd"
version = "0.1.0"
edition = "2024"
# MSRV: sqlx 0.9 đòi 1.94 (đọc từ `cargo metadata`), edition 2024 chỉ đòi 1.85. CI chạy đúng số này.
rust-version = "1.94"
license = "MIT"
publish = false
description = "Lab bài 64: crate sổ cái nhỏ để CI chạy fmt, clippy, test PostgreSQL, audit, deny và release build"

[lib]
name = "ledger_ci"
path = "src/lib.rs"

[[bin]]
name = "ledger-ci"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ledger-core = { path = "../20-ledger-core-workspace/ledger-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.0", features = ["v4"] }
# Chỉ để --verify đọc workflow và deny.toml; không có trong đường chạy của sổ cái.
toml = "1.2.1"
yaml-rust2 = "0.13.0"

[lints.rust]
unsafe_code = "forbid"

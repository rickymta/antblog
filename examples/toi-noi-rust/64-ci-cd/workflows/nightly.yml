# Workflow MẪU cho lab 64: việc đắt hoặc phụ thuộc thời gian chạy theo lịch, không chặn merge.
# CHƯA CHẠY TRÊN GITHUB. Các lệnh mutation và fuzz là của lab 57 (đã chạy ở bài 57).
name: nightly

on:
  schedule:
    # 20:23 UTC = 03:23 giờ Việt Nam; tránh đúng đầu giờ vì GitHub dồn tải ở đó.
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Advisory mới xuất hiện không cần code đổi: chạy lại audit trên Cargo.lock hiện có.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/toi-noi-rust/64-ci-cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cài toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/toi-noi-rust/64-ci-cd
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit

  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/toi-noi-rust/57-advanced-testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cài toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/toi-noi-rust/57-advanced-testing
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo mutants --file src/split.rs
      - name: Lưu báo cáo mutation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: examples/toi-noi-rust/57-advanced-testing/mutants.out/
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/toi-noi-rust/57-advanced-testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fuzz cần nightly (sanitizer); chỉ job này dùng nightly, phần còn lại của repo là stable.
      - name: Cài stable và nightly
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz 60 giây
        run: |
          mkdir -p fuzz/corpus/parse_line
          cargo +nightly fuzz run parse_line fuzz/corpus/parse_line fuzz/seeds -- -max_total_time=60
      # Crash để lại artifact; một crash tối thiểu thành test hồi quy như bài 57.
      - name: Lưu crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: examples/toi-noi-rust/57-advanced-testing/fuzz/artifacts/
          if-no-files-found: ignore
